name: VN100 Bollinger Bands & Volume Scanner

on:
  schedule:
    # Chạy thứ 2 đến thứ 6 hàng tuần
    # Giờ UTC: 04:30 UTC = 11:30 sáng giờ Việt Nam (Kết thúc phiên sáng)
    - cron: '30 4 * * 1-5'
    # Giờ UTC: 07:15 UTC = 14:15 chiều giờ Việt Nam (Gần kết phiên trước ATC để kịp đặt lệnh)
    - cron: '15 7 * * 1-5'
    # Giờ UTC: 08:05 UTC = 15:05 chiều giờ Việt Nam (Tổng kết sau khi đóng cửa thị trường)
    - cron: '05 8 * * 1-5'
  workflow_dispatch: # Cho phép kích hoạt chạy quét thủ công bất cứ lúc nào trên giao diện GitHub

jobs:
  scan_market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Stock Scanner
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/scanner.py
